[DataBase]
;Настройки базы данных
bd_host = localhost
bd_port = 5432
bd_name = diplom
bd_user = postgres
bd_pass = 123456

[Client]
;Путь к папке с текстовыми файлами
documents_path = D:\TestDocs
;Расширения файлов через запятую
file_extensions = .txt,.md,.html,.csv
;Режим переиндексации: full - полная, smart - только изменённые
index_mode = smart

[Server]
;Настройки сервера
server_port = 8080
;Количество результатов на странице
results_per_page = 10
